name: Pull Request

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - '.github/workflows/pr.yml'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      assist: ${{ steps.filter.outputs.assist }}
      cart: ${{ steps.filter.outputs.cart }}
      catalog: ${{ steps.filter.outputs.catalog }}
      identity: ${{ steps.filter.outputs.identity }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      shopping: ${{ steps.filter.outputs.shopping }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            assist: 'apps/acme-assist/**'
            cart: 'apps/acme-cart/**'
            catalog: 'apps/acme-catalog/**'
            identity: 'apps/acme-identity/**'
            order: 'apps/acme-order/**'
            payment: 'apps/acme-payment/**'
            shopping: 'apps/acme-shopping-react/**'
            workflow: '.github/workflows/pr.yml'

  build-assist:
    name: Build Assist
    needs: changes
    if: ${{ needs.changes.outputs.assist == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: apps/acme-assist

  build-cart:
    name: Build Cart
    needs: changes
    if: ${{ needs.changes.outputs.cart == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd apps/acme-cart
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        run: |
          cd apps/acme-cart
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-catalog:
    name: Build Catalog
    needs: changes
    if: ${{ needs.changes.outputs.catalog == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: apps/acme-catalog

  build-identity:
    name: Build Identity
    needs: changes
    if: ${{ needs.changes.outputs.identity == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: apps/acme-identity

  build-order:
    name: Build Order
    needs: changes
    if: ${{ needs.changes.outputs.order == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and Test
        run: |
          cd apps/acme-order
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --no-restore --verbosity normal

  build-payment:
    name: Build Payment
    needs: changes
    if: ${{ needs.changes.outputs.payment == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: apps/acme-payment

  build-shopping:
    name: Build Shopping
    needs: changes
    if: ${{ needs.changes.outputs.shopping == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/acme-shopping-react/package-lock.json
      - name: Install and Build
        run: |
          cd apps/acme-shopping-react
          npm ci
          npm run build
          npm run lint

