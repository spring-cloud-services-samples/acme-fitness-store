name: Markdown Links Check

on:
  pull_request:
    paths:
      - '**.md'

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - uses: lycheeverse/lychee-action@v2
      with:
        args: --root-dir "$(pwd)" --verbose --no-progress './**/*.md'
