plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example.acme.assist'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('javaCfenvVersion', "4.0.1")
    set('springAiVersion', "2.0.0")
    set('springCloudServicesVersion', "4.4.0")
    set('springCloudVersion', "2025.1.3")
    set('springCredhubVersion', "4.0.1")
    set('testContainersVersion', "1.21.4")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    runtimeOnly 'org.postgresql:postgresql'
    implementation "io.pivotal.cfenv:java-cfenv-boot:${javaCfenvVersion}"
    implementation "io.pivotal.cfenv:java-cfenv-boot-tanzu-genai:${javaCfenvVersion}"
    implementation "org.springframework.credhub:spring-credhub-starter:${springCredhubVersion}"
    implementation 'io.pivotal.spring.cloud:spring-cloud-services-starter-service-registry'
    implementation 'io.pivotal.spring.cloud:spring-cloud-services-starter-config-client'
    implementation 'org.springframework.cloud:spring-cloud-bindings:2.0.4'
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.skyscreamer:jsonassert:1.5.3'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testContainersVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        mavenBom "io.pivotal.spring.cloud:spring-cloud-services-dependencies:${springCloudServicesVersion}"
    }
}

bootJar {
    mainClass = 'com.example.acme.assist.FitAssistApplication'
}

bootRun {
    mainClass = 'com.example.acme.assist.FitAssistApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}
